name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned together: the SQL test runner and the metadata checker must speak the
  # same VGI protocol as the SDK. Template updates bump these (make template-diff).
  HAYBARN_VERSION: "2.0.0rc11"

jobs:
  # bun install --frozen-lockfile, tsc --noEmit (the `typecheck` script), bun test.
  quality:
    name: Typecheck + unit tests
    uses: Query-farm/vgi-actions/.github/workflows/ts-ci.yml@v1

  format:
    name: Format + lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x biome ci .

  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on private repos; add macos-latest here when you need it.
        os: [ubuntu-latest, windows-latest]
        transport: [stdio, launch, http]
        exclude:
          - os: windows-latest
            transport: launch   # the launcher uses AF_UNIX sockets
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Build the worker
        run: bun install --frozen-lockfile
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # DuckDB can't exec the sh wrappers in bin/ on Windows, so compile
            # the worker and the recipe runner into standalone executables.
            bun build src/worker.ts --compile --outfile dist/vgi-discord-worker.exe
            bun build examples/run.ts --compile --outfile dist/run-recipe.exe
            WORKER="$(cygpath -m "$PWD/dist/vgi-discord-worker.exe")"
            RECIPES_WORKER="$(cygpath -m "$PWD/dist/run-recipe.exe")"
            HAYBARN_UNITTEST="$PWD/.tools/Scripts/haybarn-unittest.exe"
          else
            WORKER="$PWD/bin/vgi-discord-worker"
            RECIPES_WORKER="$PWD/bin/run-recipe"
            HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          fi
          export WORKER RECIPES_WORKER HAYBARN_UNITTEST
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh

  metadata:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    # The linter probes write functions with their example arguments; an unreachable
    # API base (and no bot token) guarantees it never acts on Discord.
    env:
      DISCORD_API_BASE: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --production
      - name: Read fail_on from vgi-lint.toml
        id: lintcfg
        run: python3 -c 'import tomllib; print("fail_on=" + tomllib.load(open("vgi-lint.toml", "rb")).get("fail_on", "error"))' >> "$GITHUB_OUTPUT"
      - uses: Query-farm/vgi-lint-check@v2
        with:
          location: ${{ github.workspace }}/bin/vgi-discord-worker
          # Set in vgi-lint.toml, so local runs and CI agree.
          fail-on: ${{ steps.lintcfg.outputs.fail_on }}
          # Set to false if your examples need real credentials or network access.
          execute: true

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t worker:ci .
      - name: HTTP /health
        run: |
          docker run -d --name smoke -p 8000:8000 worker:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs smoke; exit 1

# Keeps GitHub Actions and npm dependencies current. @query-farm/vgi minor/major
# bumps are ignored: they can change the wire protocol, which must match the DuckDB
# extension exactly. Take those through template updates (make template-diff).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
    ignore:
      - dependency-name: "@query-farm/vgi"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@query-farm/vgi-rpc"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
